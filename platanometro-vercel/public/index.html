<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Platanómetro</title>

  <!-- ONNX Runtime Web (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

  <!-- TensorFlow.js + COCO-SSD (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>

  <style>
    body { font-family: system-ui; padding: 16px; }

    .wrap { width: 360px; position: relative; }
    video {
      width: 360px;
      border-radius: 10px;
      display: block;
      background: #000;
    }

    canvas#overlay {
      position: absolute;
      left: 0; top: 0;
      width: 360px;
      height: auto;
      border-radius: 10px;
      pointer-events: none;
    }

    .status { margin-top: 10px; width: 360px; }
    .hint { color:#666; font-size: 14px; margin-top: 6px; }
    .error { color: #b00020; white-space: pre-wrap; margin-top: 8px; }

    .feedback {
      width: 360px;
      margin-top: 10px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .feedback button {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #fff;
      cursor: pointer;
    }
    .feedback button:active { transform: scale(0.98); }
    .small { font-size: 12px; color:#666; margin-top: 6px; width:360px; }
  </style>
</head>

<body>
  <h1>Platanómetro</h1>

  <div class="wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <div class="status" id="status">Cargando…</div>
  <div class="hint" id="userbox"></div>

  <!-- Feedback mínimo del usuario -->
  <div class="feedback">
    <button id="btn_verde">Verde</button>
    <button id="btn_perfecto">Perfecto</button>
    <button id="btn_pasado">Pasado</button>
    <button id="btn_podrido">Podrido</button>
    <button id="btn_no">No es plátano</button>
  </div>
  <div class="small" id="feedback_msg">Si la predicción falla, pulsa el estado correcto. (Solo se registra un evento.)</div>

  <div class="hint">Apunta al plátano. Si no lo detecta, acércalo o mejora la luz.</div>
  <div class="error" id="error"></div>

  <canvas id="canvas" width="224" height="224" style="display:none;"></canvas>

  <script src="./app.js"></script>
</body>
</html>
